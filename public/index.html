<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة تبرع وتبادل الكتب الجامعية</title>
    <!-- خط عربي عصري (Cairo) -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- مكتبة الأيقونات (FontAwesome) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: 'Cairo', sans-serif; 
            background-color: #f8f9fa; 
            margin: 0; 
            padding: 20px; 
            color: #2d3748; 
        }
        .container { 
            max-width: 950px; 
            margin: auto; 
            background: white; 
            padding: 30px; 
            border-radius: 16px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.05); 
        }
        h1 { 
            color: #1a202c; 
            text-align: center; 
            margin-bottom: 25px; 
            font-weight: 700; 
        }
        h1 i { color: #319795; margin-left: 10px; }
        
        h2 { 
            color: #2d3748; 
            font-size: 1.2rem; 
            border-bottom: 2px solid #edf2f7; 
            padding-bottom: 8px; 
            margin-top: 25px; 
        }
        
        /* نموذج الإضافة */
        form { 
            background: #fdfdfe; 
            border: 1px solid #e2e8f0; 
            padding: 20px; 
            border-radius: 12px; 
            margin-bottom: 30px; 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px; 
        }
        form h2 { grid-column: 1 / -1; margin-top: 0; }
        input, select, button { 
            padding: 12px 15px; 
            font-size: 14px; 
            border: 1px solid #cbd5e0; 
            border-radius: 8px; 
            font-family: 'Cairo', sans-serif; 
            outline: none; 
            transition: all 0.3s; 
        }
        input:focus, select:focus { 
            border-color: #319795; 
            box-shadow: 0 0 0 3px rgba(49, 151, 149, 0.15); 
        }
        .submit-btn { 
            background-color: #319795; 
            color: white; 
            border: none; 
            cursor: pointer; 
            font-weight: 700; 
            grid-column: 1 / -1;
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 8px; 
        }
        .submit-btn:hover { background-color: #2c7a7b; }

        /* تصميم بطاقات الكتب بشكل شبكي (Grid) */
        .books-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); 
            gap: 20px; 
            margin-top: 15px; 
        }
        .book-card { 
            background: #fff; 
            border: 1px solid #e2e8f0; 
            padding: 20px; 
            border-radius: 12px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.02); 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between; 
            transition: transform 0.2s, box-shadow 0.2s; 
        }
        .book-card:hover { 
            transform: translateY(-4px); 
            box-shadow: 0 10px 15px rgba(0,0,0,0.06); 
        }
        .book-info h3 { 
            margin: 0 0 8px 0; 
            color: #2b6cb0; 
            font-size: 1.1rem; 
        }
        .book-info p { 
            margin: 6px 0; 
            font-size: 13.5px; 
            color: #4a5568; 
        }
        .status-available { 
            color: #38a169; 
            font-weight: bold; 
            background: #f0fff4; 
            padding: 3px 8px; 
            border-radius: 4px; 
            display: inline-block; 
            font-size: 12px;
        }
        .status-reserved { 
            color: #e53e3e; 
            font-weight: bold; 
            background: #fff5f5; 
            padding: 3px 8px; 
            border-radius: 4px; 
            display: inline-block; 
            font-size: 12px;
        }
        .reserve-btn { 
            background-color: #dd6b20; 
            color: white;
            border: none;
            cursor: pointer;
            margin-top: 15px; 
            padding: 8px 12px; 
            font-size: 13px; 
            width: 100%; 
            border-radius: 6px; 
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .reserve-btn:hover { background-color: #c05621; }
        .empty-msg { grid-column: 1 / -1; text-align: center; color: #a0aec0; padding: 30px; }
    </style>
</head>
<body>

<div class="container">
    <h1><i class="fa-solid fa-book-bookmark"></i> منصة تبرع وتبادل الكتب الجامعية</h1>
    
    <!-- نموذج إضافة كتاب -->
    <form id="bookForm">
        <h2><i class="fa-solid fa-circle-plus"></i> إضافة كتاب جديد للتبرع</h2>
        <input type="text" id="title" placeholder="عنوان الكتاب (مثلاً: برمجة 2)" required>
        <input type="text" id="subject" placeholder="المادة الدراسية" required>
        <select id="condition">
            <option value="ممتازة">حالة الكتاب: ممتازة</option>
            <option value="جيدة">حالة الكتاب: جيدة</option>
            <option value="مستعملة">حالة الكتاب: مستعملة</option>
        </select>
        <input type="text" id="contact_info" placeholder="وسيلة التواصل (رقم أو بريد)" required>
        <button type="submit" class="submit-btn"><i class="fa-solid fa-paper-plane"></i> نشر الكتاب في المنصة</button>
    </form>

    <!-- قائمة الكتب المتاحة -->
    <h2><i class="fa-solid fa-book-open"></i> الكتب المتاحة حالياً</h2>
    <div id="booksList" class="books-grid">
        <p class="empty-msg">جاري تحميل الكتب...</p>
    </div>
</div>

<script>
    const API_URL = 'http://localhost:3000';

    // جلب وعرض الكتب عند فتح الصفحة
    async function fetchBooks() {
        try {
            const res = await fetch(`${API_URL}/books`);
            const books = await res.json();
            const listDiv = document.getElementById('booksList');
            
            if (books.length === 0) {
                listDiv.innerHTML = '<p class="empty-msg">لا توجد كتب مضافة حالياً. كن أول المتبرعين!</p>';
                return;
            }

            listDiv.innerHTML = '';
            books.forEach(book => {
                const card = document.createElement('div');
                card.className = 'book-card';
                card.innerHTML = `
                    <div class="book-info">
                        <h3><i class="fa-solid fa-book"></i> ${book.title}</h3>
                        <p><i class="fa-solid fa-graduation-cap"></i> <strong>المادة:</strong> ${book.subject}</p>
                        <p><i class="fa-solid fa-star"></i> <strong>الحالة:</strong> ${book.condition}</p>
                        <p><i class="fa-solid fa-address-book"></i> <strong>للتواصل:</strong> ${book.contact_info}</p>
                        <p style="margin-top: 10px;"><strong>الحالة:</strong> <span class="${book.status === 'متاح' ? 'status-available' : 'status-reserved'}">${book.status}</span></p>
                    </div>
                    ${book.status === 'متاح' ? `<button class="reserve-btn" onclick="reserveBook(${book.id})"><i class="fa-solid fa-handshake"></i> حجز الكتاب</button>` : ''}
                `;
                listDiv.appendChild(card);
            });
        } catch (err) {
            console.error('خطأ في جلب البيانات', err);
            document.getElementById('booksList').innerHTML = '<p class="empty-msg">تعذر الاتصال بالخادم، تأكد من تشغيل الـ Backend.</p>';
        }
    }

    // إضافة كتاب جديد عبر الـ API
    document.getElementById('bookForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const newBook = {
            title: document.getElementById('title').value,
            subject: document.getElementById('subject').value,
            condition: document.getElementById('condition').value,
            contact_info: document.getElementById('contact_info').value
        };

        const res = await fetch(`${API_URL}/books`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(newBook)
        });

        if (res.ok) {
            document.getElementById('bookForm').reset();
            fetchBooks();
        } else {
            alert('حدث خطأ أثناء إضافة الكتاب');
        }
    });

    // تحديث حالة الكتاب إلى محجوز
    async function reserveBook(id) {
        const res = await fetch(`${API_URL}/books/${id}/reserve`, { method: 'PUT' });
        if (res.ok) {
            fetchBooks();
        } else {
            alert('حدث خطأ أثناء حجز الكتاب');
        }
    }

    // تشغيل الدالة عند تحميل الصفحة
    fetchBooks();
</script>

</body>
</html>
